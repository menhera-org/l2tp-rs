[package]
name = "l2tp"
version = "0.2.2"
authors = ["metastable-void <mori@menhera.ad.jp>"]
edition = "2024"
rust-version = "1.89"
homepage = "https://github.com/menhera-org/l2tp-rs"
repository = "https://github.com/menhera-org/l2tp-rs"
keywords = ["l2tp", "netlink", "linux"]
license = "MIT"
readme = "README.md"
description = "High-level L2TP interface for Linux kernel"

[dependencies]
netlink-packet-l2tp    = "0.3"
netlink-packet-core    = "0.9"
netlink-packet-generic = "0.5"
genetlink              = "0.3"
# `Error::Netlink` exposes this version's `DecodeError`; keep it until the next breaking release.
netlink-packet-core-08 = { package = "netlink-packet-core", version = "0.8" }
tokio                  = { version = "1", features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "macros"] }
libc                   = "0.2"
thiserror              = "2"
futures                = "0.3"
clap                   = { version = "4", features = ["derive"] }
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
