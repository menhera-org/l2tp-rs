[package]
name = "l2tp"
version = "0.4.0"
authors = ["metastable-void <mori@menhera.ad.jp>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/menhera-org/l2tp-rs"
keywords = ["l2tp", "netlink", "linux"]
categories = ["network-programming", "os::linux-apis"]
license = "MIT"
readme = "README.md"
description = "High-level L2TP interface for Linux kernel"
exclude = [".github/", ".licenserc.yaml"]

[features]
# Derive `serde` traits for the configuration, information, identifier and
# statistics types.
serde = ["dep:serde"]
# Build the supplementary, testing-only `l2tp` command-line tool.
cli = ["serde", "dep:clap", "dep:serde_json", "tokio/rt-multi-thread", "tokio/macros"]

[[bin]]
name = "l2tp"
path = "src/bin/l2tp/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

# The API is Linux-only; on other platforms the library is empty.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-l2tp    = "0.4"
netlink-packet-core    = "0.9"
netlink-packet-generic = "0.5"
netlink-proto          = "0.13"
genetlink              = "0.3"
tokio                  = { version = "1", features = ["rt", "sync", "net"] }
libc                   = "0.2"
log                    = "0.4"
thiserror              = "2"
futures                = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
bytes                  = "1"
# Binary formats for the serde round-trip test: postcard is not
# self-describing, and CBOR distinguishes byte strings from sequences.
ciborium               = "0.2"
postcard               = { version = "1", default-features = false, features = ["alloc"] }
netlink-sys            = "0.9"
serde_json             = "1"
# README examples are compiled as doctests.
tokio                  = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dependencies]
clap                   = { version = "4", features = ["derive"], optional = true }
serde                  = { version = "1", features = ["derive"], optional = true }
serde_json             = { version = "1", optional = true }
