name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - rust_target: "x86_64-unknown-linux-gnu"
          - rust_target: "x86_64-unknown-freebsd"
          - rust_target: "x86_64-unknown-fuchsia"
          - rust_target: "x86_64-apple-darwin"
          - rust_target: "x86_64-linux-android"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Stable
        run: |
          rustup override set stable
          rustup update stable
          rustup target add ${{ matrix.rust_target }}

      - name: Build test for ${{ matrix.rust_target }}
        run: cargo build --target ${{ matrix.rust_target }}

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Stable
        run: |
          rustup override set stable
          rustup update stable

      - name: Build library, CLI and tests
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features

  msrv:
    name: Build with the minimum supported Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89 --profile minimal
          rustup override set 1.89

      - name: Build with Rust 1.89
        run: cargo build --all-targets --all-features

  privileged:
    name: Privileged kernel tests
    runs-on: ubuntu-latest
    # Runs the ignored tests against the runner's kernel as root. It depends on
    # the runner shipping the l2tp modules, so it reports but does not block.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Stable
        run: |
          rustup override set stable
          rustup update stable

      - name: Load L2TP kernel modules
        run: sudo modprobe -a l2tp_core l2tp_netlink l2tp_eth l2tp_ip l2tp_ip6

      - name: Build the privileged tests
        run: cargo test --all-features --test privileged --no-run

      - name: Run the privileged tests as root
        run: >-
          sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME
          "$(command -v cargo)" test --all-features --test privileged
          -- --ignored --test-threads=1
